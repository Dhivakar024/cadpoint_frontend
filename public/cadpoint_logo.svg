<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440">
  <!-- Clean white container padding -->
  <g transform="translate(0, 10)">
    <!-- 1. RED CADPOINT TYPOGRAPHY -->
    <text x="480" y="160" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="185" fill="#EE1D23" letter-spacing="1.5">CADPOINT</text>
    
    <!-- 2. DARK NAVY BAR -->
    <rect x="70" y="192" width="820" height="74" fill="#0F172A" rx="5" />
    
    <!-- WHITE AUTHORIZED TRAINING CENTRE -->
    <text x="480" y="244" text-anchor="middle" font-family="'Arial Black', 'Helvetica', sans-serif" font-weight="900" font-size="40" fill="#FFFFFF" letter-spacing="4.5">AUTHORIZED TRAINING CENTRE</text>
    
    <!-- 3. ISO SUBTITLE (Generous line-height and padding below navy bar) -->
    <text x="480" y="340" text-anchor="middle" font-family="'Arial', sans-serif" font-weight="700" font-size="34" fill="#1E293B" letter-spacing="3.5">ISO 9001 : 2008 CERTIFIED COMPANY</text>
  </g>
</svg>
