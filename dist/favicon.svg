<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Clean White Background Canvas -->
  <rect width="512" height="512" fill="#FFFFFF" />
  
  <g transform="translate(26, 75)">
    <!-- 1. RED BOLD CADPOINT TYPOGRAPHY -->
    <text x="230" y="160" text-anchor="middle" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="120" fill="#EE1D23" letter-spacing="1">CADPOINT</text>
    
    <!-- 2. DARK NAVY AUTHORIZED TRAINING CENTRE BAR -->
    <rect x="15" y="195" width="430" height="64" fill="#0F172A" rx="4" />
    <text x="230" y="240" text-anchor="middle" font-family="'Arial Black', 'Helvetica', sans-serif" font-weight="900" font-size="21" fill="#FFFFFF" letter-spacing="1.5">AUTHORIZED TRAINING CENTRE</text>
    
    <!-- 3. ISO SUBTITLE TEXT -->
    <text x="230" y="305" text-anchor="middle" font-family="'Arial', sans-serif" font-weight="700" font-size="22" fill="#0F172A" letter-spacing="1.5">ISO 9001 : 2008 CERTIFIED COMPANY</text>
  </g>
</svg>
