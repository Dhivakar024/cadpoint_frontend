<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460">
  <!-- Official White Rounded Rectangle Logo Background Card -->
  <rect x="20" y="20" width="920" height="420" rx="32" fill="#FFFFFF" stroke="rgba(255,255,255,0.4)" stroke-width="2" />
  
  <g transform="translate(0, 20)">
    <!-- 1. RED CADPOINT TYPOGRAPHY -->
    <text x="480" y="165" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="185" fill="#EE1D23" letter-spacing="1.5">CADPOINT</text>
    
    <!-- 2. DARK NAVY BAR -->
    <rect x="75" y="198" width="810" height="74" fill="#0F172A" rx="6" />
    
    <!-- WHITE AUTHORIZED TRAINING CENTRE -->
    <text x="480" y="250" text-anchor="middle" font-family="'Arial Black', 'Helvetica', sans-serif" font-weight="900" font-size="40" fill="#FFFFFF" letter-spacing="4.5">AUTHORIZED TRAINING CENTRE</text>
    
    <!-- 3. ISO SUBTITLE -->
    <text x="480" y="348" text-anchor="middle" font-family="'Arial', sans-serif" font-weight="700" font-size="34" fill="#1E293B" letter-spacing="3.5">ISO 9001 : 2008 CERTIFIED COMPANY</text>
  </g>
</svg>
